<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1424">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>컨테이너 쌓기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600&family=IBM+Plex+Mono:wght@600&display=swap">
<style>
  /* Layout: one full-screen canvas (night container terminal), HUD and overlays floating above it.
     Single dark look on purpose: the game is a night shift at the quay. */
  :root {
    --night: #0b1424;
    --night-2: #1b2a44;
    --ink: #eaf0f7;
    --ink-dim: #9fb0c6;
    --sodium: #ffb547;
    --panel: rgba(9, 16, 29, 0.86);
    --line: rgba(159, 176, 198, 0.22);
    --display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html { height: 100%; box-sizing: border-box; background: var(--night); }
  body {
    height: 100%; margin: 0; overflow: hidden;
    background: var(--night); color: var(--ink); font-family: var(--body);
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
  }
  #app { position: relative; height: 100%; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    padding-top: calc(env(safe-area-inset-top, 0px) + 48px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    pointer-events: none;
  }
  .score { font-family: var(--display); font-size: 56px; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 2px 0 rgba(0,0,0,.4); }
  .score small { font-size: 20px; margin-left: 4px; color: var(--sodium); }
  .meta { display: grid; justify-items: end; gap: 8px; }
  .best { font-size: 13px; color: var(--ink-dim); letter-spacing: .02em; }
  .best b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .chip {
    pointer-events: auto; font: 600 12px var(--body); color: var(--ink);
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 12px; cursor: pointer;
  }
  .chip:focus-visible, .cta:focus-visible { outline: 2px solid var(--sodium); outline-offset: 2px; }

  .overlay {
    position: absolute; inset: 0; display: grid; place-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px;
    background: linear-gradient(to bottom, rgba(11,20,36,.15), rgba(11,20,36,.7));
  }
  .card {
    width: min(100%, 340px); background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 24px 22px; display: grid; gap: 14px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .eyebrow { font: 600 11px var(--mono); letter-spacing: .14em; color: var(--sodium); text-transform: uppercase; }
  h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1.05; text-wrap: balance; }
  h1 { font-size: 44px; }
  h2 { font-size: 34px; }
  .card p { margin: 0; color: var(--ink-dim); font-size: 14px; line-height: 1.55; }
  .rules { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 13.5px; line-height: 1.45; }
  .rules li { display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: baseline; }
  .rules span { font: 600 11px var(--mono); color: var(--sodium); letter-spacing: .06em; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; border-block: 1px solid var(--line); padding-block: 12px; }
  .stats div { display: grid; gap: 2px; }
  .stats b { font-family: var(--display); font-weight: 400; font-size: 26px; font-variant-numeric: tabular-nums; }
  .stats span { font-size: 11px; color: var(--ink-dim); letter-spacing: .04em; }
  .rank { font-size: 15px; color: var(--ink); }
  .rank b { color: var(--sodium); }
  .cta {
    font: 400 22px var(--display); color: #1a1205; background: var(--sodium);
    border: 0; border-radius: 4px; padding: 14px; cursor: pointer;
    box-shadow: 0 3px 0 #b5741a;
  }
  .cta:active { transform: translateY(2px); box-shadow: 0 1px 0 #b5741a; }
  .hint { text-align: center; font-size: 12px !important; }
  @media (prefers-reduced-motion: no-preference) {
    .overlay:not([hidden]) .card { animation: rise .35s ease-out; }
  }
  @keyframes rise { from { transform: translateY(14px); opacity: .4; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>
<div id="app">
  <canvas id="c" aria-label="컨테이너 쌓기 게임 화면"></canvas>

  <div class="hud">
    <div class="score" aria-live="polite"><span id="score">0</span><small>단</small></div>
    <div class="meta">
      <div class="best">최고 기록 <b id="best">0</b>단</div>
      <button class="chip" id="mute" type="button">소리 켜짐</button>
    </div>
  </div>

  <div class="overlay" id="start">
    <div class="card">
      <div class="eyebrow">Night shift · Berth 3</div>
      <h1>컨테이너 쌓기</h1>
      <p>갠트리 크레인이 컨테이너를 좌우로 옮기고 있어요. 아래 컨테이너 위에 정확히 내려놓아 최대한 높이 쌓아 보세요.</p>
      <ul class="rules">
        <li><span>TAP</span>화면을 탭하면 컨테이너를 내립니다.</li>
        <li><span>CUT</span>어긋난 부분은 잘려서 바다로 떨어져요.</li>
        <li><span>×3</span>3번 연속 딱 맞추면 폭이 다시 넓어집니다.</li>
      </ul>
      <button class="cta" id="go" type="button">작업 시작</button>
    </div>
  </div>

  <div class="overlay" id="over" hidden>
    <div class="card">
      <div class="eyebrow">Stack collapsed</div>
      <h2>적재 실패!</h2>
      <div class="stats">
        <div><b id="r-score">0</b><span>이번 기록 (단)</span></div>
        <div><b id="r-best">0</b><span>최고 기록 (단)</span></div>
        <div><b id="r-perfect">0</b><span>정확 적재</span></div>
      </div>
      <div class="rank">오늘의 등급: <b id="r-rank">수습 크레인 기사</b></div>
      <button class="cta" id="again" type="button">다시 하기</button>
      <p class="hint">스페이스바 또는 화면 탭으로도 조작할 수 있어요.</p>
    </div>
  </div>
</div>

<script>
(() => {
  // ---- World constants (logical units; the canvas is scaled to fit 360 units wide) ----
  const LW = 360, BH = 30, GROUND_PAD = 120, BASE_W = 200, PERFECT_PX = 4;
  const COLORS = [
    ['#b5452f', '#93361f'], ['#2f68a8', '#24528a'], ['#2e8a5e', '#226b48'],
    ['#d2902a', '#ab721c'], ['#6d7c8c', '#566370'], ['#1f8a8a', '#176c6c'],
  ];
  const RANKS = [[0, '수습 크레인 기사'], [8, '숙련 크레인 기사'], [18, '베테랑 갠트리 기사'], [30, '터미널의 전설']];

  const cvs = document.getElementById('c');
  const ctx = cvs.getContext('2d');
  const $ = (id) => document.getElementById(id);
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let scale = 1, LH = 640;
  let state = 'ready', stack = [], cur = null, debris = [], pops = [], flashes = [];
  let cam = 0, score = 0, combo = 0, perfects = 0, shake = 0, best = 0, muted = false, overAt = 0;
  const stars = Array.from({ length: 70 }, () => ({ x: Math.random() * LW, y: Math.random(), r: Math.random() * 1.2 + 0.3 }));

  try { best = +localStorage.getItem('stack-best') || 0; muted = localStorage.getItem('stack-muted') === '1'; } catch (e) {}

  // ---- ISO 6346 container number with a real check digit ----
  const LETTER = {};
  (() => { let v = 10; for (const ch of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ') { if (v % 11 === 0) v++; LETTER[ch] = v++; } })();
  function containerNo() {
    const owner = 'PLYU', serial = String(Math.floor(Math.random() * 1e6)).padStart(6, '0');
    const code = owner + serial;
    let sum = 0;
    for (let i = 0; i < 10; i++) sum += (LETTER[code[i]] ?? +code[i]) * 2 ** i;
    return `${owner} ${serial} ${(sum % 11) % 10}`;
  }

  // ---- Sound (starts only after the first tap) ----
  let ac = null;
  function beep(freq, dur, type = 'triangle', vol = 0.25) {
    if (muted) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, ac.currentTime);
      o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.6), ac.currentTime + dur);
      g.gain.setValueAtTime(vol, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
    } catch (e) {}
  }
  const buzz = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

  // ---- Layout ----
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = cvs.clientWidth, h = cvs.clientHeight;
    cvs.width = Math.round(w * dpr); cvs.height = Math.round(h * dpr);
    scale = w / LW; LH = h / scale;
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  }
  const groundY = () => LH - GROUND_PAD;
  const sy = (yW) => groundY() - (yW - cam); // screen y of a world height

  // ---- Game flow ----
  function reset() {
    stack = [{ x: (LW - BASE_W) / 2, w: BASE_W, base: true }];
    debris = []; pops = []; flashes = [];
    score = 0; combo = 0; perfects = 0; cam = 0;
    newCur();
    updateHud();
  }
  function newCur() {
    const top = stack[stack.length - 1];
    const fromLeft = stack.length % 2 === 0;
    let c;
    do { c = Math.floor(Math.random() * COLORS.length); } while (top.c === c);
    cur = {
      w: top.w, x: fromLeft ? -top.w * 0.5 : LW - top.w * 0.5, dir: fromLeft ? 1 : -1,
      speed: Math.min(110 + score * 7, 320), c, no: containerNo(), type: top.w > 150 ? '45G1' : '22G1',
    };
  }
  function start() {
    reset(); state = 'play';
    $('start').hidden = true; $('over').hidden = true;
  }
  function drop() {
    const top = stack[stack.length - 1];
    const yW = stack.length * BH;
    if (Math.abs(cur.x - top.x) <= PERFECT_PX) {
      combo++; perfects++;
      let { x, w } = top;
      if (combo >= 3 && w < BASE_W) { const g = Math.min(10, BASE_W - w); w += g; x -= g / 2; }
      stack.push({ x, w, c: cur.c, no: cur.no, type: cur.type });
      flashes.push({ x, w, yW, life: 1 });
      pops.push({ text: combo > 1 ? `정확! ×${combo}` : '정확!', x: x + w / 2, yW: yW + BH, life: 1 });
      beep(520 + Math.min(combo, 8) * 70, 0.18, 'sine', 0.2); buzz(15);
    } else {
      const left = Math.max(cur.x, top.x), right = Math.min(cur.x + cur.w, top.x + top.w);
      const ov = right - left;
      if (ov <= 0) {
        debris.push({ x: cur.x, w: cur.w, yW, vy: 0, vx: cur.dir * 60, rot: 0, vr: cur.dir * 1.8, c: cur.c, no: cur.no, type: cur.type });
        cur = null;
        return gameOver();
      }
      combo = 0;
      const leftCut = cur.x < top.x;
      debris.push({ x: leftCut ? cur.x : right, w: cur.w - ov, yW, vy: 0, vx: leftCut ? -40 : 40, rot: 0, vr: leftCut ? -2.2 : 2.2, c: cur.c });
      stack.push({ x: left, w: ov, c: cur.c, no: cur.no, type: cur.type });
      beep(110, 0.16); buzz(10);
    }
    shake = reduceMotion ? 0 : 3;
    score = stack.length - 1;
    updateHud();
    newCur();
  }
  function gameOver() {
    state = 'over'; overAt = performance.now();
    beep(70, 0.6, 'sawtooth', 0.18); buzz([30, 40, 60]);
    if (score > best) { best = score; try { localStorage.setItem('stack-best', best); } catch (e) {} }
    updateHud();
    let rank = RANKS[0][1];
    for (const [min, name] of RANKS) if (score >= min) rank = name;
    $('r-score').textContent = score; $('r-best').textContent = best;
    $('r-perfect').textContent = perfects; $('r-rank').textContent = rank;
    setTimeout(() => { if (state === 'over') $('over').hidden = false; }, 700);
  }
  function updateHud() {
    $('score').textContent = score; $('best').textContent = best;
    $('mute').textContent = muted ? '소리 꺼짐' : '소리 켜짐';
  }
  function act() {
    if (state === 'play') drop();
    else if (state === 'ready') start();
    else if (state === 'over' && performance.now() - overAt > 900) start();
  }

  // ---- Input ----
  cvs.addEventListener('pointerdown', (e) => { e.preventDefault(); act(); });
  for (const id of ['start', 'over']) $(id).addEventListener('pointerdown', (e) => { if (e.target.id === id) act(); });
  $('go').addEventListener('click', start);
  $('again').addEventListener('click', start);
  $('mute').addEventListener('click', (e) => {
    e.stopPropagation(); muted = !muted;
    try { localStorage.setItem('stack-muted', muted ? '1' : '0'); } catch (err) {}
    updateHud();
  });
  addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'Enter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON' && state !== 'play') return;
      e.preventDefault(); act();
    }
  });
  addEventListener('resize', resize);

  // ---- Update ----
  function update(dt) {
    if (state === 'play' && cur) {
      cur.x += cur.dir * cur.speed * dt;
      const minX = -cur.w * 0.5, maxX = LW - cur.w * 0.5;
      if (cur.x < minX) { cur.x = minX; cur.dir = 1; }
      if (cur.x > maxX) { cur.x = maxX; cur.dir = -1; }
    }
    const topW = (stack.length + 1) * BH;
    const camT = Math.max(0, topW - groundY() + LH * 0.38);
    cam += (camT - cam) * Math.min(1, dt * 5);
    for (const d of debris) { d.vy += 1500 * dt; d.yW -= d.vy * dt; d.x += d.vx * dt; d.rot += d.vr * dt; }
    debris = debris.filter((d) => sy(d.yW) < LH + 200);
    for (const p of pops) p.life -= dt * 0.9;
    pops = pops.filter((p) => p.life > 0);
    for (const f of flashes) f.life -= dt * 2.5;
    flashes = flashes.filter((f) => f.life > 0);
    shake *= Math.pow(0.001, dt);
  }

  // ---- Draw ----
  function drawContainer(x, y, w, c, no, type) {
    const [body, rib] = COLORS[c];
    ctx.fillStyle = body; ctx.fillRect(x, y, w, BH);
    ctx.fillStyle = rib;
    for (let i = x + 5; i < x + w - 4; i += 6) ctx.fillRect(i, y + 4, 2, BH - 8);
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.fillRect(x, y, w, 3); ctx.fillRect(x, y + BH - 3, w, 3);
    if (w > 12) { ctx.fillRect(x, y, 4, BH); ctx.fillRect(x + w - 4, y, 4, BH); }
    ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fillRect(x, y, w, 1);
    if (no && w > 96) {
      ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, BH); ctx.clip();
      ctx.fillStyle = 'rgba(255,255,255,.88)';
      ctx.font = '600 7.5px "IBM Plex Mono", ui-monospace, monospace';
      ctx.fillText(no, x + 9, y + 13);
      ctx.fillText(type, x + 9, y + 22);
      ctx.restore();
    }
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, LH);
    g.addColorStop(0, '#070d19'); g.addColorStop(1, '#1b2a44');
    ctx.fillStyle = g; ctx.fillRect(0, 0, LW, LH);
    ctx.fillStyle = '#cfd9e8';
    for (const s of stars) {
      const y = ((s.y * LH + cam * 0.08) % LH);
      ctx.globalAlpha = 0.25 + s.r * 0.35; ctx.fillRect(s.x, y, s.r, s.r);
    }
    ctx.globalAlpha = 1;
    // moon
    ctx.fillStyle = 'rgba(255,236,200,.9)';
    ctx.beginPath(); ctx.arc(300, 160 + cam * 0.05, 15, 0, Math.PI * 2); ctx.fill();

    // distant terminal skyline (parallax)
    const horizon = groundY() + cam * 0.3;
    ctx.fillStyle = '#132038';
    for (let i = 0; i < 6; i++) {
      const bx = 10 + i * 64;
      ctx.fillRect(bx, horizon - 70, 5, 70); ctx.fillRect(bx + 26, horizon - 70, 5, 70);
      ctx.fillRect(bx - 8, horizon - 74, 52, 6);
      ctx.fillRect(bx + 30, horizon - 74, 22, 3);
    }
    ctx.fillStyle = '#0f1a2e'; ctx.fillRect(0, horizon - 22, LW, 22);
    for (let i = 0; i < 18; i++) {
      ctx.fillStyle = i % 3 ? '#16243d' : '#1c2c48';
      ctx.fillRect(i * 21, horizon - 22 - (i * 37 % 3) * 8, 19, 8 + (i * 37 % 3) * 8);
    }

    // quay, water, ruler
    const gy = sy(0);
    if (gy < LH) {
      ctx.fillStyle = '#3b4352'; ctx.fillRect(0, gy, LW, 18);
      ctx.fillStyle = '#2a303b'; ctx.fillRect(0, gy + 18, LW, 6);
      ctx.fillStyle = '#071226'; ctx.fillRect(0, gy + 24, LW, LH);
      ctx.fillStyle = 'rgba(255,181,71,.35)';
      for (let i = 0; i < 9; i++) ctx.fillRect(18 + i * 42, gy + 32 + (i % 3) * 9, 14 + (i % 2) * 8, 1.5);
    }
    ctx.fillStyle = 'rgba(159,176,198,.5)';
    ctx.font = '600 9px "IBM Plex Mono", ui-monospace, monospace';
    for (let i = 5; i <= stack.length + 8; i += 5) {
      const y = sy(i * BH + BH);
      if (y < -10 || y > LH) continue;
      ctx.fillRect(0, y, 10, 1);
      ctx.fillText(`${i}`, 13, y + 3);
    }
  }

  function drawCrane() {
    // gantry girder across the top
    ctx.fillStyle = '#c9932e'; ctx.fillRect(0, 26, LW, 9);
    ctx.fillStyle = '#8f6519';
    for (let i = 0; i < LW; i += 14) ctx.fillRect(i, 28, 2, 6);
    ctx.fillStyle = '#e8b04a'; ctx.fillRect(0, 26, LW, 1.5);
    if (!cur) return;
    const cx = cur.x + cur.w / 2;
    const cy = sy((stack.length + 1) * BH);
    ctx.fillStyle = '#3a4250'; ctx.fillRect(cx - 18, 33, 36, 12);
    ctx.fillStyle = '#ffb547'; ctx.fillRect(cx - 3, 37, 6, 3);
    ctx.strokeStyle = 'rgba(210,220,232,.7)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx - 12, 45); ctx.lineTo(cur.x + cur.w * 0.22, cy - 5);
    ctx.moveTo(cx + 12, 45); ctx.lineTo(cur.x + cur.w * 0.78, cy - 5);
    ctx.stroke();
    ctx.fillStyle = '#e0a83d'; ctx.fillRect(cur.x + 2, cy - 5, cur.w - 4, 5);
  }

  function draw() {
    ctx.save();
    if (shake > 0.05) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    drawBackground();

    // stack
    for (let i = 0; i < stack.length; i++) {
      const b = stack[i];
      const y = sy((i + 1) * BH);
      if (y > LH || y < -BH) continue;
      if (b.base) {
        ctx.fillStyle = '#4b5361'; ctx.fillRect(b.x, y, b.w, BH);
        for (let k = 0; k < b.w; k += 16) {
          ctx.fillStyle = (k / 16) % 2 ? '#1d1f24' : '#e3b23c';
          ctx.fillRect(b.x + k, y, Math.min(16, b.w - k), 5);
        }
        ctx.fillStyle = '#9fb0c6'; ctx.font = '600 9px "IBM Plex Mono", ui-monospace, monospace';
        ctx.fillText('BAY 03 · ROW 07', b.x + 8, y + 21);
      } else drawContainer(b.x, y, b.w, b.c, b.no, b.type);
    }

    for (const f of flashes) {
      const y = sy(f.yW + BH), grow = (1 - f.life) * 8;
      ctx.strokeStyle = `rgba(255,236,190,${f.life})`; ctx.lineWidth = 2;
      ctx.strokeRect(f.x - grow, y - grow, f.w + grow * 2, BH + grow * 2);
    }

    if (state === 'play' && cur) {
      drawCrane();
      drawContainer(cur.x, sy((stack.length + 1) * BH), cur.w, cur.c, cur.no, cur.type);
    } else drawCrane();

    for (const d of debris) {
      ctx.save();
      ctx.translate(d.x + d.w / 2, sy(d.yW + BH) + BH / 2); ctx.rotate(d.rot);
      drawContainer(-d.w / 2, -BH / 2, d.w, d.c, d.no, d.type);
      ctx.restore();
    }

    ctx.textAlign = 'center';
    ctx.font = '22px "Black Han Sans", "Apple SD Gothic Neo", sans-serif';
    for (const p of pops) {
      ctx.fillStyle = `rgba(255,181,71,${Math.min(1, p.life * 1.5)})`;
      ctx.fillText(p.text, Math.min(LW - 50, Math.max(50, p.x)), sy(p.yW) - 12 - (1 - p.life) * 30);
    }
    ctx.textAlign = 'left';
    ctx.restore();
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt); draw();
    requestAnimationFrame(frame);
  }

  function boot(data) {
    if (data && data.best > best) best = data.best;
    resize(); reset(); updateHud();
    requestAnimationFrame(frame);
  }
  window.claude?.hot?.snapshot?.(() => ({ best }));
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
